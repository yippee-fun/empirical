inherit_from:
  - "https://www.goodcop.style/tabs.yml"

AllCops:
  TargetRubyVersion: 3.4

Style/RedundantSelf:
  Enabled: false

Lint/EmptyFile:
  Enabled: false

Layout/SpaceAroundMethodCallOperator:
  Enabled: false

Style/RescueModifier:
  Exclude:
    - "test/ivar_guards.test.rb"
    - "test/prop_signatures.test.rb"
